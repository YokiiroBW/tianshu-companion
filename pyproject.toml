[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshu-companion"
version = "0.1.0"
description = "Recoverable text companion core and thin channel bridge"
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.1", "uvicorn==0.42.0", "httpx==0.28.1", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.6"]
nonebot = ["nonebot2[fastapi]==2.5.0", "nonebot-adapter-onebot==2.4.0"]

[tool.setuptools.packages.find]
where = ["src", "integrations/nonebot"]

[tool.setuptools.package-data]
"tianshu_companion.skills" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
